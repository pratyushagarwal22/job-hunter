# Priority companies for Stage 3 (Apollo enrichment).
#
# Companies listed here use JOBHUNT_STAGE3_PER_KIND_PRIORITY_MAX as the per-kind
# pagination ceiling instead of JOBHUNT_STAGE3_PER_KIND_DEFAULT_MAX. Match is
# case-insensitive on `name` against SHORTLIST.company; `domain` is optional and
# only used to override the auto-guessed Apollo organization domain when
# present (i.e. it is fed straight into mixed_people/api_search's
# q_organization_domains_list).
#
# Edit freely — Stage 3 reloads this file every run. Keep entries focused on
# companies where you actually want maximum recruiter / hiring-manager surface
# area; everything else gracefully falls back to the default cap.

