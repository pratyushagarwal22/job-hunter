# Priority companies for Stage 3 (Apollo enrichment).
#
# Companies listed here use JOBHUNT_STAGE3_PER_KIND_PRIORITY_MAX as the per-kind
# pagination ceiling instead of JOBHUNT_STAGE3_PER_KIND_DEFAULT_MAX. Match is
# case-insensitive on `name` against SHORTLIST.company.
#
# Each row may use either:
#   - domain: "example.com"  — single Apollo organization domain
#   - domains: ["a.com", "b.com"]  — multiple domains for q_organization_domains_list
# If both are set, `domains` wins.
#
# Edit freely — Stage 3 reloads this file every run.

